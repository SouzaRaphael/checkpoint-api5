server.port=8080
springdoc.swagger-ui.path=/

# spring.datasource.url=jdbc:mysql://localhost:3306/api?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root_pwd
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL:host.docker.internal}:${DB_SERVER_PORT:3306}/${DB_SCHEMA:study}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:root_pwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect